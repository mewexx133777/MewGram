name: Export Libraries

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mkdir %userprofile%\TBuild\ThirdParty
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
        shell: cmd

      - name: ThirdParty cache
        uses: actions/cache/restore@v4
        with:
          path: TBuild/ThirdParty
          key: Windows-x64-third-party-e7c80eb39b77d97d47bffd2582a1f2190de4d230f08925aff499d70039adb052
          restore-keys: |
            Windows-x64-third-party-

      - name: Libraries cache
        uses: actions/cache/restore@v4
        with:
          path: TBuild/Libraries
          key: Windows-x64-libs-v2-e7c80eb39b77d97d47bffd2582a1f2190de4d230f08925aff499d70039adb052
          restore-keys: |
            Windows-x64-libs-v2-

      - name: Archive ThirdParty
        run: |
          7z a -tzip -mx=1 thirdparty.zip %userprofile%\TBuild\ThirdParty
        shell: cmd

      - name: Archive Libraries
        run: |
          7z a -tzip -mx=1 libraries.zip %userprofile%\TBuild\Libraries
        shell: cmd

      - name: Upload ThirdParty
        uses: actions/upload-artifact@v4
        with:
          name: thirdparty
          path: thirdparty.zip

      - name: Upload Libraries
        uses: actions/upload-artifact@v4
        with:
          name: libraries
          path: libraries.zip
